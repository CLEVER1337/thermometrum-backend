services:
  backend:
    build: .
    container_name: thermometrum-backend
    ports:
      - "5056:8080"
    environment:
      ClickHouse__ConnectionString: "Host=clickhouse;Port=8123;Database=thermometrum;Username=thermometrum"
      Mqtt__Host: "mosquitto"
    depends_on:
      clickhouse:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: thermometrum-clickhouse
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/users.d/thermometrum.xml:/etc/clickhouse-server/users.d/thermometrum.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: thermometrum-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  clickhouse-data:
